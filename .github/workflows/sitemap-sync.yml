name: MoneySmart sitemap sync

on:
  schedule:
    # Mondays 00:00 UTC (~10:00 AEST)
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Sync sitemap and apply drafts
        run: npm run sync:sitemap
      - name: Validate guides
        run: npm run validate:guides
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-sync-report
          path: |
            content/SITEMAP_SYNC_REPORT.md
            content/pending-from-sitemap.json
            content/SITEMAP_APPLY_BRIEF.md
            content/pending-tools.json
            content/hub-map-overrides.json
      - name: Commit sync outputs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            content/moneysmart-sitemap.xml \
            content/moneysmart-urls.txt \
            content/SITEMAP_SYNC_REPORT.md \
            content/pending-from-sitemap.json \
            content/SITEMAP_APPLY_BRIEF.md \
            content/pending-tools.json \
            content/hub-map-overrides.json \
            content/guides \
            scripts/generate-articles.mjs \
            scripts/rewrite-one-guide.mjs \
            src/lib/content/taxonomy.ts \
            || true
          if git diff --staged --quiet; then
            echo "No sitemap/apply changes"
          else
            git commit -m "chore: MoneySmart sitemap sync (report + applied drafts)"
            git push
          fi
